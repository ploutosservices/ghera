[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghera"
version = "0.1.0"
description = "Tenant and application fences on PostgreSQL row-level security, for a service that reaches its database as one role"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ploutos Services" }]
requires-python = ">=3.10"
dependencies = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]
